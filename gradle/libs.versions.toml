[versions]
agp = "8.13.2"
kotlin = "2.4.20"

# AndroidX / Compose
#
# ⚠️ 升级下面几个版本前，必须先确认目标版本的 AAR 元数据里
# `minCompileSdk` ≤ 36 且 `minAndroidGradlePluginVersion` ≤ 8.13.2。
#
# 这些约束写在 AAR 内的
# `META-INF/com/android/build/gradle/aar-metadata.properties` 里，
# **Gradle 版本目录和 Maven 页面都看不出来**，只有在 `CheckAarMetadata`
# 阶段才会以「requires ... compile against version 37 or later」的形式炸出来。
#
# 踩过的坑：core-ktx 1.19.1 / Compose 1.12.x / lifecycle 2.11.0 /
# navigation 2.10.x / activity 1.13.0 全都要求 compileSdk 37 + AGP 9.1.0。
#
# 本项目固定在 compileSdk 36（AGP 8.13.2 支持的上限，且本机已装 android-36），
# 所以下面每个版本都是该「代」里最后一个可用版本，实测值：
#   core-ktx 1.18.0            → minCompileSdk=36
#   activity-compose 1.12.4    → 36
#   lifecycle 2.10.0           → 34
#   navigation-compose 2.9.8   → 35
#   Compose BOM 2026.06.01     → ui/foundation/animation 1.11.4，minCompileSdk=35
#   datastore-preferences 1.1.7 → 34
#   media3 1.11.1              → 36
coreKtx = "1.18.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
composeBom = "2026.06.01"
datastore = "1.1.7"
documentFile = "1.1.0"
palette = "1.0.0"

# Media
media3 = "1.11.1"

# FFmpeg 软件解码扩展（NextLib）。发布在 **Maven Central**（不是 JitPack）。
#
# ⚠️ 版本号规则是「<它支持的 Media3 版本>-<自身版本>」，所以必须跟着上面的 media3 走：
#    1.11.1-0.16.0 正好对应 media3 1.11.1。换成不匹配的组合会在运行时
#    `NoSuchMethodError` / `AbstractMethodError`，编译期完全看不出来。
#
# ⚠️ 同样受上面那条 AAR 元数据约束。实测 `nextlib-media3ext-1.11.1-0.16.0.aar`：
#    minCompileSdk=36（= 本项目上限，刚好够）、minAndroidGradlePluginVersion=1.0.0。
#
# ⚠️ 许可证是 **GPL-3.0**（它的 FFmpeg 构建启用了 GPL 组件）。链接进来意味着整个应用
#    以 GPL-3.0 分发：必须附带完整源码、衍生作品也必须 GPL-3.0。
#
# ⚠️ 它提供的是**解码器**（音视频编码格式），不是**解封装器**（封装/容器格式）。
#    因此「本机没有解码器」能被它救回来，「无法识别封装格式」不能——
#    WMV/ASF、RealMedia(RM/RMVB) 至今仍放不了，别指望升级这个库能解决。
nextlib = "1.11.1-0.16.0"

# 设备上推理引擎（LiteRT-LM）。
#
# ⚠️ **必须写死具体版本**，不能用官方文档里那种 `latest.release`：本项目发布的是
#    可复现构建（README 里承诺了「标签 + 提交与安装包一一对应」），一个会自己往前走的
#    版本号会让同一个标签在两台机器上产出不同的 APK。
#
# 🔴 这个 AAR 的体积几乎全在原生库上（实测 0.17.1，20,493,837 字节）：
#      classes.jar                    160,701 字节（只有 78 个 class）
#      jni/arm64-v8a/liblitertlm_jni.so   21,802,960 字节（未压缩）
#      jni/x86_64/liblitertlm_jni.so      25,968,008 字节（未压缩）
#    它**只带这两个 ABI**，而 `app/build.gradle.kts` 的 abiFilters 正好也只放这两个，
#    所以能直接依赖，不必像 sherpa-onnx 那样解包（见 core:asr 的 build.gradle.kts）。
#    代价是 APK 会明显变大——这是本地推理绕不过去的成本。
#
# 传递依赖（POM 里 compile scope，会进 APK）：gson 2.14.0、kotlin-reflect 2.4.0、
# kotlinx-coroutines-android 1.11.0（最后这个与本项目 coroutines 版本一致）。
#
# 已核对：AAR 里**没有** `META-INF/com/android/build/gradle/aar-metadata.properties`，
# 所以不受 `minCompileSdk` / `minAndroidGradlePluginVersion` 那两条例约束缚。
litertlm = "0.17.1"

# 图片加载（封面）。
#
# 🔴 **不要升到 3.6.x。** 3.6.0 / 3.6.3 的 `coil-core-android` AAR 元数据里
#    `minCompileSdk=37`（本项目 36），而且它的 Compose 构件是按 JetBrains Compose
#    Multiplatform 1.12.0 构建的：`org.jetbrains.compose.foundation:foundation:1.12.0`
#    会把整条 androidx compose 栈从 BOM 给的 1.11.4 顶到 1.12.0（报错说“requires
#    Android Gradle plugin 9.1.0”，但真正的元凶不是 AGP 而是这条传递依赖）。
#    AAR 元数据在这里是唯一可信的判据：Maven 页面不写这两个键，版本目录更不会报。
#
# 3.5.0 实测可过：`minCompileSdk=36`、JB compose 1.11.1（低于 BOM 的 1.11.4，
# 不会向上顶）。升版本之前先跑一次 `:core:data:checkDebugAarMetadata`。
#
# ⚠️ **不要**加 `coil-network-okhttp` / `coil-network-ktor`：本项目只从本机
#    （`content://` / `file://`）取图，网络封面是明确不做的（见 `ArtworkSourceRules`）。
#    多一个网络模块就多一个 OkHttp 版本要和 media3-datasource-okhttp 对齐。
coil = "3.5.0"

# KotlinX
coroutines = "1.11.0"
serialization = "1.11.0"

# DI
koin = "4.2.2"

# Test
junit = "4.13.2"

[libraries]
# --- AndroidX 基础 ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-palette-ktx = { module = "androidx.palette:palette-ktx", version.ref = "palette" }

# --- Lifecycle / Navigation ---
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Compose (版本由 BOM 统一管理) ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- Media3 ---
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

# --- FFmpeg 软件解码（GPL-3.0） ---
# 只在 `:core:player` 里用 `implementation` 引入：它是实现细节，不该出现在
# `PlaybackController` 的公开签名里（见 MspPlaybackState 里「不泄漏 Media3 类型」的说明）。
nextlib-media3ext = { module = "io.github.anilbeesetti:nextlib-media3ext", version.ref = "nextlib" }

# --- 设备上推理（LiteRT-LM）---
# 只在 `:core:llm` 里以 `implementation` 引入：`Engine` / `Conversation` 这些类型
# 不该出现在任何别的模块的公开签名里（否则换引擎要改一大片）。
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }

# --- 图片加载（封面）---
# `coil-core`：只做取图/解码/缓存，不含单例与 Compose 组件。数据层只需要它
# （自定义 Fetcher 与 Keyer 都在这个构件里），不需要把 Compose 拖进 core:data。
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
# `coil-compose`：`AsyncImage` / `ImageRequest` 以及单例 `SingletonImageLoader`
# （后者在它的传递依赖 `io.coil-kt.coil3:coil` 里，声明这一个就够）。
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# --- KotlinX ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- DI ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# --- Test ---
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

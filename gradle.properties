# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# 注意：不要在这里写 org.gradle.java.home（会把本机绝对路径提交进仓库）。
# JDK 21 固定在用户级的 ~/.gradle/gradle.properties 里，命令行和 Android Studio 都不用手工指定。
# 万一那份用户级配置丢了，可以这样临时救急：
#   $env:JAVA_HOME = "C:\Program Files\Microsoft\jdk-21.0.8.9-hotspot"
#
# 为什么必须是 21：本机机器级 JAVA_HOME 指向 C:\Program Files\Java\jdk-25，
# 而 Gradle 8.14.3 在 JDK 25 下会以 `* What went wrong: 25.0.1` 直接失败。
#
# Android Studio 侧对应的设置（Settings → Build, Execution, Deployment → Build Tools → Gradle）：
# 「Default Gradle JVM criteria」的 Version 要选 21；默认推导出来的 25 会让同步失败。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
